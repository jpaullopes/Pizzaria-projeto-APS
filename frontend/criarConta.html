<!-- frontend/criarConta.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Criar Conta - Pizzaria</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2>Criar Conta de Atendente</h2>
  <form id="criarContaForm">
    <label for="username">Usuário:</label>
    <input type="text" id="username" name="username" required>
    <br>
    <label for="password">Senha:</label>
    <input type="password" id="password" name="password" required>
    <br>
    <label for="confirmPassword">Repetir Senha:</label>
    <input type="password" id="confirmPassword" name="confirmPassword" required>
    <br>
    <label>
      <input type="checkbox" id="termos" required>
      Aceito os <a href="#" id="verTermos">Termos de Serviço</a>
    </label>
    <br>
    <button type="submit">Criar Conta</button>
  </form>
  
  <!-- Modal para os Termos de Serviço -->
  <div id="modalTermos" class="modal">
    <div class="modal-content">
      <span id="fecharModal" class="close">&times;</span>
      <p id="termosTexto"> [Aceito trabalhar 12 horas por dia, durante 7 dias da semana para receber apenas R$1512 (se incluir hora extra obviamente kkkkk)]</p>
      <!-- Para alterar o texto dos termos, edite o conteúdo deste parágrafo (id="termosTexto"). -->
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    // Lógica do modal de termos
    const modal = document.getElementById('modalTermos');
    const verTermos = document.getElementById('verTermos');
    const fecharModal = document.getElementById('fecharModal');

    verTermos.addEventListener('click', (e) => {
      e.preventDefault();
      modal.style.display = 'block';
    });

    fecharModal.addEventListener('click', () => {
      modal.style.display = 'none';
    });

    window.addEventListener('click', (e) => {
      if(e.target === modal) {
        modal.style.display = 'none';
      }
    });

    // Lógica de criação de conta
    document.getElementById('criarContaForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      
      if(password !== confirmPassword) {
        alert('As senhas não conferem.');
        return;
      }
      
      try {
        const response = await fetch('http://localhost:3000/atendentes', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const result = await response.json();
        if(result.success) {
          alert('Conta criada com sucesso! Faça login.');
          window.location.href = 'login.html';
        } else {
          alert(result.message);
        }
      } catch (error) {
        console.error(error);
        alert('Erro ao criar conta.');
      }
    });
  </script>
</body>
</html>
